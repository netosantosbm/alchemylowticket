version: '3.8'

services:
  plataforma-lowticket:
    build:
      context: .
      dockerfile: Dockerfile
    image: plataforma-lowticket:latest
    container_name: plataforma-lowticket
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=${DATABASE_URL}
      - DOMAIN=${DOMAIN:-alchemylow.shop}
      - PORT=8000
      - HOST=0.0.0.0
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:8000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
